# pip install .   builds the compiler with CMake and installs the `preplang` command, with the
# pandas lifter and the two Python tools as `preplang-lift`, `preplang-contracts` and
# `preplang-release-facts`. The version comes from CMakeLists.txt.

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "preplang"
dynamic = ["version"]
description = "A data-aware compiler for table and image preparation pipelines, from .prep to pandas and OpenCV"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nikhil V" }]
requires-python = ">=3.9"
# What the generated programs need for tables; OpenCV only for image pipelines.
dependencies = ["numpy", "pandas>=2.0", "pyarrow"]
keywords = ["compiler", "domain-specific language", "data preparation", "data validation", "pandas"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
images = ["opencv-python-headless"]

[project.urls]
Repository = "https://github.com/Nikhi00718/preLang"

[project.scripts]
preplang-lift = "preplang.pandas2prep:main"
preplang-contracts = "preplang.contracts:main"
preplang-release-facts = "preplang.release_facts:main"

[tool.scikit-build]
minimum-version = "0.10"
wheel.py-api = "py3"  # the wheel holds an executable, not an extension module
wheel.packages = ["python/preplang"]
cmake.define = { PREPLANG_TESTS = "OFF" }
sdist.exclude = ["build*/", "eval/data/", "eval/work/", "eval/.venv*/", "paper/", "demo/", "docs/review*/", "output/"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(PrepLang VERSION (?P<value>[0-9.]+)'
