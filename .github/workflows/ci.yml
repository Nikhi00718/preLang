name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generated programs and tools/release_facts.py use these
      - name: Install Python packages
        run: python -m pip install numpy pandas pyarrow opencv-python-headless

      # On Windows, --run starts the generated program with the py launcher
      - name: Install Python packages for the py launcher
        if: runner.os == 'Windows'
        run: py -3 -m pip install numpy pandas pyarrow opencv-python-headless

      # Apple's libc++ lacks floating-point std::from_chars (the CSV scanner uses it): GCC from Homebrew
      - name: Use GCC on macOS
        if: runner.os == 'macOS'
        run: echo "CXX=$(brew --prefix gcc@14)/bin/g++-14" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python' }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      # Unit tests, every example compiled end to end, and the fuzz targets replaying their corpus
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Compile and run the students example
        shell: bash
        run: |
          exe=build/preplang
          [ -f build/Release/preplang.exe ] && exe=build/Release/preplang.exe
          "$exe" examples/tabular/students.prep --run
          test -s output/clean.csv

  # AddressSanitizer and UndefinedBehaviorSanitizer over every test and example
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Build with -fsanitize=address,undefined
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPREPLANG_SANITIZE=ON -DPython3_EXECUTABLE="$pythonLocation/bin/python"
          cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  # Line, function and branch coverage of src/ by the tests; fails below 85% of lines
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy gcovr==8.3
      - name: Build with coverage counters
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPREPLANG_COVERAGE=ON -DPython3_EXECUTABLE="$pythonLocation/bin/python"
          cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          mkdir -p coverage
          gcovr -r . --filter 'src/' build --txt-summary --html-details coverage/index.html --fail-under-line 85 | tee coverage/summary.txt
          { echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # clang-format (.clang-format) on all C++ code and clang-tidy (.clang-tidy) on the compiler
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install clang-format==19.1.7 clang-tidy==19.1.0
      - name: clang-format
        run: clang-format --dry-run --Werror src/*.cpp src/*/*.cpp src/*/*.h tests/*.cpp fuzz/*.cpp
      - name: clang-tidy
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          ls src/*.cpp src/*/*.cpp fuzz/*.cpp | xargs -P 4 -n 1 clang-tidy -p build --quiet

  # libFuzzer on the parts that read untrusted bytes, two minutes each, from the seed corpus
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and its fuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev
      - name: Build the fuzz targets
        run: |
          CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPREPLANG_FUZZ=ON
          cmake --build build --parallel --target fuzz_parser fuzz_csv fuzz_parquet
      - name: Fuzz
        run: |
          mkdir -p crashes work/parser work/csv work/parquet
          cp examples/*/*.prep fuzz/corpus/parser/* work/parser/
          cp examples/tabular/*.csv fuzz/corpus/csv/* work/csv/
          cp tests/data/*.parquet work/parquet/
          for target in parser csv parquet; do
            ./build/fuzz_$target work/$target -max_total_time=120 -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix=crashes/$target- -print_final_stats=1
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/

  # pip install builds the compiler and installs its commands; used from a clean folder
  pip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use GCC on macOS
        if: runner.os == 'macOS'
        run: echo "CXX=$(brew --prefix gcc@14)/bin/g++-14" >> "$GITHUB_ENV"
      - name: pip install
        run: python -m pip install .
      - name: Use the installed commands
        shell: bash
        run: |
          mkdir -p ../use && cp -r examples ../use/ && cd ../use
          preplang --version
          preplang examples/tabular/students.prep --python > /dev/null
          python output/generated.py
          test -s output/clean.csv
          preplang examples/errors/semantic_error.prep --json | python -c "import json, sys; assert json.load(sys.stdin)['errors'] > 0"
          printf 'import pandas as pd\ndf = pd.read_csv("examples/tabular/students.csv")\ndf = df.dropna()\ndf.to_csv("out.csv", index=False)\n' > clean.py
          preplang-lift clean.py -o lifted.prep && preplang lifted.prep --explain > /dev/null
          preplang-contracts --help > /dev/null && preplang-release-facts --help > /dev/null

  # The Dockerfile builds, its tests pass and the image runs the compiler
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t preplang .
      - run: docker run --rm preplang
      - run: docker run --rm preplang preplang --version

  # The Lean 4 proofs check (proofs/README.md)
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
